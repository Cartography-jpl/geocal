[pytest]
# Change location of tmp directory, which tends to be really small on
# pistol. --strict-markers makes a misspelled marker (e.g.,
# pytest.mark.skp) an error, rather than silently running the test.
addopts = --basetemp=./pytest_tmp --strict-markers
markers =
    long_test: Mark a test as taking a long time
    matlab: Mark a test as needing matlab to run
# Warnings we have looked at and don't need to worry about. Keep these
# specific, so we still see any new warnings.
filterwarnings =
    # numpy's OpenBLAS starts a pool of idle threads when it is imported,
    # so any multiprocessing fork gets this warning. geocal itself
    # doesn't start threads until they are used. Note the tests also
    # pass with the "forkserver" start method, which becomes the default
    # in python 3.14.
    ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
    # scikit-umfpack (imported by scipy) is built with an older SWIG that
    # gives this warning with python 3.12+. The geocal wrappers use SWIG
    # 4.4, which doesn't have this problem.
    ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning
    # The NITF RIP sample file has MATESA and ILLUMA TREs that pynitf
    # can't parse. pynitf treats these as unknown TREs, which is fine for
    # our tests.
    ignore:Trouble reading TRE (MATESA|ILLUMA):UserWarning
