# Newer versions of pip prefer a pyproject.toml file. All this does is say
# we are using setup tools. Note that this also triggers "build isolation"
# We don't actually need or want this, instead we want to use the packages we
# have already installed with conda. So we use --no-build-isolation when
# we install this with pip:
#
# pip install . --no-build-isolation

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
ignore = [
    # Explicit int() around round/floor/ceil. The values are often numpy
    # scalars, where the int() is needed to get a python integer (e.g.,
    # for indexing), so we keep it.
    "RUF046",
]

[tool.ruff.lint.flake8-bugbear]
# These are used as default arguments, and are not modified, so it is
# fine to share a single instance.
extend-immutable-calls = [
    "geocal_swig.Time.parse_time",
    "geocal_swig.GeodeticConverter",
    "geocal_swig.SimpleDem",
    "geocal_swig.CcorrLsmMatcher",
    "osgeo.osr.SpatialReference",
    "osgeo.osr.GetUserInputAsWKT",
]

[tool.ruff.lint.per-file-ignores]

# __init__ includes things it doesn't use (e.g., __version__), which
# is really its job. So don't warn about this.

"__init__.py" = ["F401", "F403"]

[tool.mypy]
# Run as "mypy" from this directory. Type hints are documentation, not
# strict contracts (see CLAUDE.md), so this uses the default settings
# rather than --strict.
files = ["geocal"]
# Report type: ignore comments that are no longer needed
warn_unused_ignores = true

[[tool.mypy.overrides]]
# pynitf and the GDAL python bindings (osgeo) have no type information,
# and ipywidgets is only used for optional notebook support.
module = ["pynitf", "pynitf.*", "osgeo", "osgeo.*", "ipywidgets"]
ignore_missing_imports = true
