[workspace]
authors = ["Mike Smyth <Mike.M.Smyth@jpl.nasa.gov>"]
channels = ["conda-forge", "fake-afids-conda-channel"]
name = "build-pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
afids = "*"
afids-development-tools = "*"
# Use the afids build of libblitz, which patches the blitz headers to fix
# GCC compiler warnings (see afids-conda-package/libblitz).
libblitz = { version = "1.0.2.*", build = "*_1000", channel = "fake-afids-conda-channel" }
conda = "*"
pandas-stubs = "*"
# The committed SWIG wrappers in bindings/python/swig are generated with
# SWIG 4.4. Update the wrappers if this moves to a newer SWIG.
swig = "4.4.*"
# Type stubs for mypy. scipy-stubs tracks the scipy version.
scipy-stubs = "*"
types-tabulate = "*"
types-seaborn = "*"
# clang-format/clang-tidy for "make format" and "make lint". Pinned: clang-format
# output differs a little between versions, and "make format" should give the
# same result for everyone.
clang-tools = "22.*"
# clang's builtin headers (lib/clang/22/include), which clang-tidy and clangd need;
# clang-tools doesn't include them. clang-22 rather than the "clang" package,
# which would also pull in the clang compiler driver and a newer binutils.
clang-22 = "22.*"
